<style>
/* מלווה NLP — עיצוב נקי ומודרני: צבע הדגשה אחד (פטרול), אפורים ניטרליים,
   רשימות עם קווים דקים במקום כרטיסים. נכתב RTL עם תכונות לוגיות. */

:root {
  --bg: #FFFFFF;
  --panel: #F6F7F7;
  --ink: #202124;
  --ink-2: #5F6368;
  --ink-3: #8A8F95;
  --line: #E4E6E8;
  --line-2: #EEF0F1;
  --field: #DADCE0;
  --accent: #0E5E6F;
  --accent-2: #0A4856;
  --mist: #E3EEF0;
  --on-accent: #FFFFFF;
  --mark: #D7EAEE;
  --danger: #B3261E;
  --danger-bg: #FBEAE9;
  --ok: #1E6B3A;
  --hand: #1F3FA8;
  --scrim: rgba(32, 33, 36, .45);
  --radius: 8px;
  --font: 'IBM Plex Sans Hebrew', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121417;
  --panel: #181B1F;
  --ink: #E8EAED;
  --ink-2: #A5ABB2;
  --ink-3: #7A8088;
  --line: #2A2E33;
  --line-2: #22262A;
  --field: #3A3F45;
  --accent: #5FB3C3;
  --accent-2: #86C9D5;
  --mist: #163238;
  --on-accent: #0B2328;
  --mark: #1E4950;
  --danger: #F2B8B5;
  --danger-bg: #3A1F1E;
  --ok: #8FD4A6;
  --hand: #9DB2FF;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417;
    --panel: #181B1F;
    --ink: #E8EAED;
    --ink-2: #A5ABB2;
    --ink-3: #7A8088;
    --line: #2A2E33;
    --line-2: #22262A;
    --field: #3A3F45;
    --accent: #5FB3C3;
    --accent-2: #86C9D5;
    --mist: #163238;
    --on-accent: #0B2328;
    --mark: #1E4950;
    --danger: #F2B8B5;
    --danger-bg: #3A1F1E;
    --ok: #8FD4A6;
    --hand: #9DB2FF;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

html { font-size: 16px; }
html[data-font="sm"] { font-size: 15px; }
html[data-font="lg"] { font-size: 18px; }

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.3; }
h2 { font-size: 1.125rem; font-weight: 600; line-height: 1.4; }
h3 { font-size: 1rem; font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- סרגל עליון ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 24px;
  height: 56px; padding-inline: 24px;
  background: var(--bg);
  border-block-end: 1px solid var(--line);
}
.brand { font-weight: 600; font-size: 1rem; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.tabs { display: flex; gap: 22px; height: 100%; overflow-x: auto; scrollbar-width: none; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; height: 100%;
  color: var(--ink-2); font-size: .9rem; white-space: nowrap;
  border-block-end: 2px solid transparent; margin-block-end: -1px;
}
.tab:hover { color: var(--ink); text-decoration: none; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 500; border-block-end-color: var(--accent); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--mist); color: var(--accent);
  font-size: .75rem; font-weight: 600;
  display: grid; place-items: center; overflow: hidden; flex: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-link:hover { text-decoration: none; }
.demo-note {
  font-size: .8rem; color: var(--ink-2);
  padding: 6px 24px; border-block-end: 1px solid var(--line-2); background: var(--panel);
}

/* ---------- עמוד ---------- */
.page { max-width: 760px; margin-inline: auto; padding: 32px 24px 80px; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-block-end: 20px; }
.page-head .meta { font-size: .875rem; color: var(--ink-2); white-space: nowrap; }
.lead { color: var(--ink-2); margin-block: -8px 24px; max-width: 60ch; }
.section { margin-block-start: 40px; }
.section > h2 { margin-block-end: 8px; }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: .875rem; margin-block-end: 16px; color: var(--ink-2); }

/* ---------- כפתורים ושדות ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding-inline: 14px;
  border: 1px solid var(--field); border-radius: var(--radius);
  font-size: .9rem; font-weight: 500; color: var(--ink); background: var(--bg);
  white-space: nowrap;
}
.btn:hover { background: var(--panel); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn-danger { color: var(--danger); }
.btn-quiet { border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn-quiet:hover { background: var(--mist); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.icon-btn {
  width: 34px; height: 34px; border-radius: var(--radius);
  display: grid; place-items: center; color: var(--ink-3);
}
.icon-btn:hover { background: var(--panel); color: var(--ink); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 6px; margin-block-end: 14px; }
.field label { font-size: .875rem; font-weight: 500; }
.field .hint { font-size: .8rem; color: var(--ink-2); }
input[type="text"], input[type="email"], input[type="search"], textarea, select {
  width: 100%; border: 1px solid var(--field); border-radius: var(--radius);
  background: var(--bg); padding: 8px 12px; font-size: .95rem; line-height: 1.5;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--mist); }
textarea { resize: vertical; min-height: 84px; }

.search {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--field); border-radius: var(--radius);
  height: 42px; padding-inline: 12px; color: var(--ink-3);
  margin-block-end: 12px;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--mist); }
.search input { border: 0; padding: 0; height: 100%; background: none; box-shadow: none !important; }

/* ---------- מסננים (טאבים טקסטואליים) ---------- */
.filters {
  display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none;
  border-block-end: 1px solid var(--line); margin-block-end: 4px;
}
.filters::-webkit-scrollbar { display: none; }
.filter {
  padding-block: 8px; font-size: .875rem; color: var(--ink-2); white-space: nowrap;
  border-block-end: 2px solid transparent; margin-block-end: -1px;
}
.filter:hover { color: var(--ink); }
.filter[aria-pressed="true"] { color: var(--accent); font-weight: 500; border-block-end-color: var(--accent); }

/* ---------- רשימות ---------- */
.list > li { border-block-end: 1px solid var(--line-2); }
.list > li:last-child { border-block-end: 0; }
.row { display: flex; gap: 14px; align-items: flex-start; padding-block: 16px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 1.05rem; font-weight: 500; line-height: 1.5; }
.row-sub { font-size: .875rem; color: var(--ink-2); margin-block-start: 2px; }
.row-side { font-size: .8rem; color: var(--ink-2); white-space: nowrap; padding-block-start: 4px; }
.row-actions { display: flex; gap: 2px; margin-block-start: -4px; }
.row-link { display: flex; gap: 14px; align-items: center; padding-block: 16px; color: var(--ink); }
.row-link:hover { text-decoration: none; }
.row-link:hover .row-title { color: var(--accent); }
.chev { color: var(--ink-3); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding-inline: 1px; }

.note-preview {
  margin-block-start: 8px; font-size: .9rem; color: var(--hand);
  border-inline-start: 2px solid var(--mist); padding-inline-start: 10px; border-radius: 0;
  white-space: pre-wrap;
}

/* ---------- התקדמות ---------- */
.bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.bar-wrap { width: 120px; flex: none; }
.bar-wrap .small { margin-block-start: 4px; text-align: end; }

.stats { display: flex; gap: 32px; flex-wrap: wrap; margin-block: 8px 0; }
.stat .num { font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
.stat .lbl { font-size: .8rem; color: var(--ink-2); }

/* ---------- חזרה ---------- */
.qa { padding-block: 18px; }
.qa-q { font-size: 1.05rem; font-weight: 500; }
.qa-a { margin-block-start: 8px; color: var(--ink); max-width: 64ch; }
.qa-state { font-size: .8rem; color: var(--ink-2); margin-inline-start: 8px; font-weight: 400; }
.qa-state.known { color: var(--ok); }
.qa-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-block-start: 12px; }

.flash { text-align: center; padding-block: 40px 24px; }
.flash .cat { font-size: .85rem; color: var(--accent); font-weight: 500; margin-block-end: 12px; }
.flash .q { font-size: 1.4rem; font-weight: 500; line-height: 1.45; max-width: 30ch; margin-inline: auto; }
.flash .a { margin-block-start: 24px; color: var(--ink); max-width: 56ch; margin-inline: auto; text-align: start; }
.flash .btn-row { justify-content: center; margin-block-start: 28px; }

/* ---------- תרחישים ---------- */
.quote {
  margin: 16px 0; padding-inline-start: 14px;
  border-inline-start: 3px solid var(--accent); border-radius: 0;
  font-size: 1.05rem; color: var(--ink);
}
